<!DOCTYPE html>
<html lang="uk" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>The Story · Oleg Ro (DeusFlow)</title>
  <meta name="description" content="Ніч у бібліотеці: історія життя, випробувань і творчої філософії Олега Ро, викарбувана на пергаменті." />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=20260824" />
  <link rel="shortcut icon" href="/favicon.ico?v=20260824" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20260824" />
  <meta name="theme-color" content="#0d0a08" />

  <!-- Google Fonts: Handwriting & Editorial -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cinzel:wght@500;700;900&family=Marck+Script&family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,400;1,600&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/assets/css/story.css?v=20260824-clouds-v3" />

  <!-- GSAP & ScrollTrigger -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>

  <!-- ES Module Import Map for Three.js -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <!-- Atmospheric Background: Diagonal Window Light Beam (Top-Left) -->
  <div class="library-light-beam"></div>

  <!-- Distant Candlelight Bokeh -->
  <div class="candle-bokeh-container">
    <div class="candle-bokeh candle-1"></div>
    <div class="candle-bokeh candle-2"></div>
    <div class="candle-bokeh candle-3"></div>
    <div class="candle-bokeh candle-4"></div>
  </div>

  <!-- Fullscreen 3D WebGL Canvas for Transition-Only Shards & Embers -->
  <canvas id="webgl-canvas"></canvas>

  <!-- Archival Paper Vignette & Subtle Film Grain -->
  <div class="parchment-vignette"></div>

  <!-- Antique Manuscript Border -->
  <div class="enchanted-frame">
    <div class="corner-filigree c-tl"></div>
    <div class="corner-filigree c-tr"></div>
    <div class="corner-filigree c-bl"></div>
    <div class="corner-filigree c-br"></div>
  </div>

  <!-- HUD Interface -->
  <header class="folio-hud">
    <div class="hud-top">
      <a href="/" class="hud-link" id="hud-back">
        <span>&larr; DeusFlow</span>
      </a>

      <div class="folio-status-badge">
        <span class="gold-sparkle-dot"></span>
        <span id="hud-act-label">ACT I // ROOTS & THE FIRST LENS</span>
      </div>

      <button class="hud-btn" id="audio-toggle" type="button" aria-label="Toggle Sound">
        <span id="audio-status">SOUND: OFF</span>
      </button>
    </div>

    <div class="hud-bottom">
      <div id="hud-scene-title">PROLOGUE // THE THRESHOLD</div>
      <div id="hud-timecode">FOLIO 01 / 06</div>
    </div>
  </header>

  <!-- Folio Section Stepper Navigation -->
  <nav class="act-stepper" aria-label="Folio Milestones">
    <button class="step-dot active" data-step="0" aria-label="Section 0: Threshold"></button>
    <button class="step-dot" data-step="1" aria-label="Section 1: Name"></button>
    <button class="step-dot" data-step="2" aria-label="Section 2: Childhood"></button>
    <button class="step-dot" data-step="3" aria-label="Section 3: Crimea"></button>
    <button class="step-dot" data-step="4" aria-label="Section 4: Camera"></button>
    <button class="step-dot" data-step="5" aria-label="Section 5: Epilogue"></button>
  </nav>

  <!-- Tall Scroll Container to enable ScrollTrigger progress -->
  <div class="scroll-wrapper" style="height: 500vh; pointer-events: none;">
  </div>

  <!-- Main 3D Story Journey Engine -->
  <script type="module" src="/assets/js/story.js?v=20260824-blender-space-v15"></script>

</body>
</html>
